[project]
name = "domotica-hub"
version = "0.1.0"
description = "Servicio MCP que encola tareas de domótica para Claude Code y Codex"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
domotica-hub = "domotica_hub.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
